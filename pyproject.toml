[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "cflive"
version = "0.1.0"
description = "A contamination-resistant Codeforces benchmark with private verified tests"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "typer>=0.15,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7", "playwright>=1.49,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cflive = "cflive.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: real Docker sandbox integration and security tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
